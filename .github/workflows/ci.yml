name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The Hypothesis comparison harness lives on the unrelated-history
# `hypothesis-baseline` branch and is Python; it is deliberately not
# built here.

jobs:
  vendor-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Resolve each claimed release tag, verify its peeled commit, apply the
      # reviewed patches, and byte-compare every upstream-derived vendored
      # OCaml source. This job intentionally needs no OCaml installation.
      - run: ./scripts/check_vendor_provenance.sh

      # The Core-dependent dogfood has package-shaped generated copies. Check
      # all of them, including the ppx sources, rather than a sample.
      - run: ./scripts/sync_consumer_snapshot.sh --check

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 5.3 only, for now. The first CI run failed on 5.1 and 5.2
        # with "This variant pattern is expected to have type
        # core_type_desc" from the VENDORED ppx_quickcheck, which does
        # not compile against the ppxlib those compilers resolve to.
        # That is a real portability limit rather than a packaging slip,
        # and widening the matrix again should follow a fix to the
        # vendored ppx, not a version pin that hides it.
        ocaml-compiler: ["5.3"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      # Install development and test dependencies for all three local
      # packages. The workspace build resolves their libraries directly;
      # the separate package-install job tests installed artefacts.
      - run: opam install . --deps-only --with-test --with-doc

      - run: opam exec -- dune build

      # Every installed Tapecheck module has an explicit interface. Keep its
      # generated API documentation buildable as those contracts evolve.
      - run: opam exec -- dune build @doc

      # The suite is the point of this workflow, not the build. It
      # contains the regression guard (shrink quality AND cost, with
      # every threshold tied to a specific past regression), the bisim
      # health assertions, the statistics accounting checks, and the
      # determinism checks. --force defeats dune's action cache, which
      # would otherwise replay a cached success without running the
      # tests (the dune-cache option above makes that reachable in CI).
      - run: opam exec -- dune runtest --force

      # Catches a public function being DROPPED. Added after a merge
      # resolver silently discarded resume_result/resume_run/
      # resume_run_exn -- 73 lines of one side against 1 of the other,
      # and the rule took the wrong side. A test happened to call one of
      # them; nothing structural would have noticed.
      # Check-only: the script no longer rewrites the baseline, so a
      # drift here is a real signal rather than something CI absorbs
      # into a checkout it then throws away.
      - run: ./scripts/check_api_surface.sh

  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true

      # Pin all three packages before asking the solver to install Tapecheck.
      # This is the supported preview path until the observer seam is in the
      # upstream splittable_random package.
      - run: opam pin add --kind=path splittable_random . --no-action --yes
      - run: opam pin add --kind=path base_quickcheck . --no-action --yes
      - run: opam pin add --kind=path tapecheck . --no-action --yes
      - run: opam install tapecheck --yes

      # This nested project sees only installed packages. It also exercises
      # the installed ppx_quickcheck rather than merely linking Tape_engine.
      - run: opam exec -- dune exec --root . ./main.exe
        working-directory: install-smoke

  # Shrink quality is deterministic given the seeds, so a drift in the
  # numbers is a real signal rather than flakiness. Run the guard on its
  # own so its output is easy to find in the log when it fails.
  regression-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune exec test_regression/regression_guard.exe
